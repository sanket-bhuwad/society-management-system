<div class="member-container">

  <div class="header">

    <h2>Members</h2>

    <button mat-raised-button color="primary" (click)="openDialog()">

      <mat-icon>add</mat-icon>

      Add Member

    </button>

  </div>

  <mat-form-field appearance="outline">

    <mat-label>Search Member</mat-label>

    <input matInput (keyup)="applyFilter($event)" placeholder="Search...">

  </mat-form-field>

  <table mat-table [dataSource]="dataSource">

    <ng-container matColumnDef="fullName">

      <th mat-header-cell *matHeaderCellDef>Name</th>

      <td mat-cell *matCellDef="let member">

        {{member.fullName}}

      </td>

    </ng-container>

    <ng-container matColumnDef="email">

      <th mat-header-cell *matHeaderCellDef>Email</th>

      <td mat-cell *matCellDef="let member">

        {{member.email}}

      </td>

    </ng-container>

    <ng-container matColumnDef="mobile">

      <th mat-header-cell *matHeaderCellDef>Mobile</th>

      <td mat-cell *matCellDef="let member">

        {{member.mobile}}

      </td>

    </ng-container>

    <ng-container matColumnDef="wing">

      <th mat-header-cell *matHeaderCellDef>Wing</th>

      <td mat-cell *matCellDef="let member">

        {{member.wing}}

      </td>

    </ng-container>

    <ng-container matColumnDef="flatNumber">

      <th mat-header-cell *matHeaderCellDef>Flat</th>

      <td mat-cell *matCellDef="let member">

        {{member.flatNumber}}

      </td>

    </ng-container>

    <ng-container matColumnDef="status">

      <th mat-header-cell *matHeaderCellDef>Status</th>

      <td mat-cell *matCellDef="let member">

        {{member.status}}

      </td>

    </ng-container>

    <ng-container matColumnDef="actions">

      <th mat-header-cell *matHeaderCellDef>Action</th>

      <td mat-cell *matCellDef="let member">

        <button mat-icon-button color="primary" (click)="editMember(member)">

          <mat-icon>edit</mat-icon>

        </button>

        <button mat-icon-button color="warn">

          <mat-icon>delete</mat-icon>

        </button>

      </td>

    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

  </table>

  <mat-paginator [pageSize]="5" [pageSizeOptions]="[5,10,20]">
  </mat-paginator>

</div>
